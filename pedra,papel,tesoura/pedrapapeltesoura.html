<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedra, Papel, Tesoura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1 class="texto">Pedra, papel, tesoura!</h1>
        <br>
        <h2 class="texto" id="escolha-texto">Escolha sua opção:</h2>
        <div class="escolha pagina" id="selecao">
            <button class="botao pessoa" id="pedra">
                🪨
            </button>
            <button class="botao pessoa" id="papel">
                📝
            </button>
            <button class="botao pessoa" id="tesoura">
                ✂️
            </button>
        </div>
        <div class="escolha pagina" id="disputa" style="display: none;">
            <span class="icone">👤</span>
            <button class="botao pessoa" id="jogar-denovo"></button>
            <span class="texto versus">VS</span>
            <button class="botao robo" disabled="disabled"></button>
            <span class="icone">🤖</span>
        </div>
        <h3 class="texto" id="texto-opcao">Selecione uma opção...</h3>
    </div>
</body>
<script src="script.js"></script>
</html>
