<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedra, Papel, Tesoura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1 class="texto">Pedra, papel, tesoura!</h1>
        <br>
        <h2 class="texto">Escolha sua opção:</h2>
        <div class="escolha" style="display: none;">
            <button class="escolha-mao" id="pedra">
                🪨
            </button>
            <button class="escolha-mao" id="papel">
                🧻
            </button>
            <button class="escolha-mao" id="tesoura">
                ✂️
            </button>
        </div>
        <div class="disputa">
            <span></span>
            <button class="resultado pessoa">🪨</button>
            <span class="texto versus">VS</span>
            <button class="resultado robo" disabled="disabled">✂️</button>
        </div>
        <h3 class="texto">Selecione uma opção</h3>
    </div>
</body>
<script src="script.js"></script>
</html>
